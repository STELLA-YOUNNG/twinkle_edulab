<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>월별 공유 기도제목 | 청주신성교회 | 로이교회</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--ink:#24354a;--muted:#66758a;--line:#dce5ee;--paper:#fff;--bg:#f3f7fb;--blue:#365f8b;--blue2:#eaf2fb;--green:#527d70}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR","Malgun Gothic",sans-serif;line-height:1.55}header{background:linear-gradient(130deg,#203d5b,#456d8e);color:#fff;padding:30px 18px 26px;text-align:center}header .eyebrow{font-size:12px;letter-spacing:.18em;opacity:.85}h1{font-size:clamp(23px,5vw,34px);margin:8px 0 6px;letter-spacing:-.04em}header p{margin:0;color:#e2edf7;font-size:14px}main{max-width:900px;margin:22px auto;padding:0 14px 40px}.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:16px;box-shadow:0 5px 18px #1c3b5910}.controls{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px;color:var(--muted)}select,input,textarea{font:inherit;width:100%;border:1px solid #cbd7e4;border-radius:10px;padding:11px 12px;background:#fff;color:var(--ink)}textarea{resize:vertical;min-height:95px}.monthline{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.monthline h2{font-size:21px;margin:0}.small{font-size:12px;color:var(--muted)}.entries{display:grid;gap:12px}.entry{border:1px solid var(--line);border-radius:13px;padding:14px;background:#fbfdff}.entryhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:9px}.entryhead strong{font-size:14px}.entry textarea{min-height:76px}.btnrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.btn{border:0;border-radius:10px;padding:11px 15px;font:inherit;font-size:14px;font-weight:700;cursor:pointer}.btn:disabled{opacity:.55;cursor:not-allowed}.primary{background:var(--blue);color:#fff}.soft{background:var(--blue2);color:var(--blue)}.danger{background:#fff0ef;color:#a33c36}.notice{font-size:12px;color:var(--muted);margin-top:10px}.notice.ok{color:#2c6a4f;font-weight:700}.notice.err{color:#a33c36;font-weight:700}.shared-card{background:#fdfdfd;border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px}.shared-name{font-weight:700;color:var(--blue);margin-bottom:8px;border-bottom:1px solid var(--line);padding-bottom:6px}.shared-item{margin-bottom:8px}.shared-item strong{font-size:14px;display:block;color:var(--ink)}.shared-item p{margin:0;font-size:14px;color:var(--muted);white-space:pre-wrap}.empty{text-align:center;padding:24px 10px;color:var(--muted)}.live{display:inline-flex;align-items:center;gap:6px}.live::before{content:"";width:8px;height:8px;border-radius:50%;background:#43a36f;box-shadow:0 0 0 3px #43a36f20}
.comment-box{margin-top:14px;padding-top:12px;border-top:1px dashed #cfdbe6}.comment-head{display:flex;align-items:center;justify-content:space-between;gap:10px}.comment-count{font-size:13px;font-weight:800;color:var(--blue)}.comment-write{border:0;border-radius:9px;background:var(--blue2);color:var(--blue);padding:7px 10px;font-weight:800;font-size:12px;cursor:pointer}.comment-list{display:grid;gap:8px;margin-top:9px}.comment-row{background:#f7fafc;border:1px solid #e3eaf1;border-radius:10px;padding:9px 10px}.comment-meta{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:11px;color:var(--muted);margin-bottom:3px}.comment-meta strong{font-size:12px;color:#415469}.comment-body{font-size:13px;white-space:pre-wrap;color:#526477}.comment-actions{display:flex;gap:5px}.comment-actions button{border:0;border-radius:7px;padding:4px 7px;font-size:11px;font-weight:700;cursor:pointer}.comment-edit{background:#eaf2fb;color:var(--blue)}.comment-delete{background:#fff0ef;color:#a33c36}.comment-compose{display:grid;gap:7px;margin-top:10px;padding:10px;background:#f8fbfe;border-radius:11px}.comment-compose.hidden{display:none}.comment-compose input{padding:9px 10px}.comment-compose textarea{min-height:62px;padding:9px 10px}.comment-compose .btn{padding:9px 12px}.comment-empty{font-size:12px;color:#8a97a7;margin-top:8px}
footer{text-align:center;color:var(--muted);font-size:12px;padding:0 12px 28px}@media(max-width:640px){.controls{grid-template-columns:1fr}.monthline{align-items:flex-start;flex-direction:column;gap:4px}.comment-meta{align-items:flex-start;flex-direction:column}.comment-actions{align-self:flex-end}}
</style>
</head>
<body>
<header><div class="eyebrow">MONTHLY PRAYER JOURNAL</div><h1>월별 공유 기도제목</h1><p>청주신성교회 | 로이교회</p></header>
<main>
<section class="panel"><div class="controls"><div class="field"><label for="church">교회</label><select id="church"><option>로이교회</option></select></div><div class="field"><label for="person">내 이름 (작성자)</label><input id="person" maxlength="40" placeholder="이름을 정확히 입력하세요"></div><div class="field"><label for="year">연도</label><select id="year"></select></div><div class="field"><label for="month">월</label><select id="month"></select></div></div><p class="notice" style="color:var(--blue);font-weight:bold">이 웹사이트에서 저장한 내용은 공동체와 함께 실시간으로 공유됩니다.</p></section>
<section class="panel"><div class="monthline"><h2 id="periodTitle">나의 기도제목 작성</h2><span class="small">작성 후 꼭 저장해주세요</span></div><div class="entries" id="entries"></div><div class="btnrow"><button class="btn soft" id="add" type="button">＋ 기도제목 추가</button><button class="btn primary" id="save" type="button">서버에 저장 / 공유하기</button></div><p class="notice" id="status" aria-live="polite">이름을 입력하고 기도제목을 작성한 뒤 저장하기를 눌러주세요.</p></section>
<section class="panel"><div class="monthline"><h2 id="sharedTitle">모두의 기도제목</h2><span class="small live">실시간 공유</span></div><div id="shared-entries"><p class="notice">기도제목을 불러오는 중입니다...</p></div></section>
</main><footer>조용히 기록하고, 신실하게 기도합니다.</footer>
<script>
const SUPABASE_URL='https://mmcmukiygjosimutmrup.supabase.co';
const SUPABASE_KEY='sb_publishable_cZb72z-nQsxIi5OL0N-zfA_z-qP2ngy';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id),yearSel=$('year'),monthSel=$('month'),now=new Date();
for(let y=now.getFullYear()-2;y<=now.getFullYear()+5;y++){const o=document.createElement('option');o.value=y;o.textContent=y+'년';if(y===now.getFullYear())o.selected=true;yearSel.append(o)}
for(let m=1;m<=12;m++){const o=document.createElement('option');o.value=m;o.textContent=m+'월';if(m===now.getMonth()+1)o.selected=true;monthSel.append(o)}
function randomUuid(){return crypto.randomUUID?crypto.randomUUID():'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0,v=c==='x'?r:(r&3|8);return v.toString(16)})}
const OWNER_KEY_STORAGE='shared-prayer-owner-key-v1';let ownerKey=localStorage.getItem(OWNER_KEY_STORAGE);if(!ownerKey){ownerKey=randomUuid();localStorage.setItem(OWNER_KEY_STORAGE,ownerKey)}
const COMMENT_SOURCE='roy',COMMENT_KEY_STORAGE='prayer-comment-editor-key-roy-v1',COMMENT_OWN_STORAGE='prayer-comment-own-ids-roy-v1',COMMENT_NAME_STORAGE='prayer-comment-name-roy-v1';let commentKey=localStorage.getItem(COMMENT_KEY_STORAGE);if(!commentKey){commentKey=randomUuid();localStorage.setItem(COMMENT_KEY_STORAGE,commentKey)}
let ownCommentIds=new Set();try{ownCommentIds=new Set(JSON.parse(localStorage.getItem(COMMENT_OWN_STORAGE)||'[]'))}catch(e){}
function saveOwnComments(){localStorage.setItem(COMMENT_OWN_STORAGE,JSON.stringify([...ownCommentIds]))}
let items=[],channel=null;function periodKey(){return `${yearSel.value}-${monthSel.value}`}function rowIdKey(){return `shared-prayer-row-${periodKey()}`}
function setStatus(message,type=''){const el=$('status');el.textContent=message;el.className='notice'+(type?' '+type:'')}
function render(){$('periodTitle').textContent=`${yearSel.value}년 ${monthSel.value}월 나의 기도제목`;$('sharedTitle').textContent=`${yearSel.value}년 ${monthSel.value}월 모두의 기도제목`;const host=$('entries');host.innerHTML='';if(!items.length)items=[{title:'가정과 가족',body:''},{title:'신앙과 영적 성장',body:''}];items.forEach((it,i)=>{const div=document.createElement('div');div.className='entry';const head=document.createElement('div');head.className='entryhead';const label=document.createElement('strong');label.textContent=`기도제목 ${i+1}`;head.append(label);const title=document.createElement('input');title.placeholder='기도제목 이름 (예: 가족의 믿음)';title.value=it.title||'';title.oninput=()=>items[i].title=title.value;const body=document.createElement('textarea');body.placeholder='기도할 내용을 적어보세요.';body.value=it.body||'';body.oninput=()=>items[i].body=body.value;div.append(head,title,body);host.append(div)})}
async function loadMyData(){const rowId=localStorage.getItem(rowIdKey());if(!rowId){items=[];render();setStatus('이 브라우저에서 이번 달에 저장한 기록이 없습니다. 새로 작성해주세요.');return}const {data,error}=await sb.from('shared_prayers').select('id,church,person,year,month,items').eq('id',rowId).maybeSingle();if(error){console.error(error);setStatus('내 기록을 불러오지 못했습니다. 새로 작성하거나 다시 시도해주세요.','err');return}if(data){$('person').value=data.person||'';items=Array.isArray(data.items)?data.items:[];render();setStatus('이 브라우저에서 저장했던 기도제목을 불러왔습니다.','ok')}else{localStorage.removeItem(rowIdKey());items=[];render()}}
async function saveToServer(){const personName=$('person').value.trim();if(!personName){alert('저장하려면 먼저 이름을 입력해주세요!');$('person').focus();return}const cleaned=items.map(it=>({title:(it.title||'').trim(),body:(it.body||'').trim()})).filter(it=>it.title||it.body);if(!cleaned.length){alert('공유할 기도제목을 한 가지 이상 작성해주세요.');return}$('save').disabled=true;setStatus('서버에 저장 중입니다...');const {data,error}=await sb.rpc('save_shared_prayer',{p_owner_key:ownerKey,p_church:$('church').value,p_person:personName,p_year:Number(yearSel.value),p_month:Number(monthSel.value),p_items:cleaned});$('save').disabled=false;if(error){console.error(error);setStatus('저장 중 오류가 발생했습니다. 인터넷 연결을 확인한 뒤 다시 시도해주세요.','err');return}if(data)localStorage.setItem(rowIdKey(),data);items=cleaned;render();setStatus('저장 완료! 지금 모든 사람의 화면에 공유되었습니다.','ok');await loadSharedData()}
function makeText(tag,text,className){const el=document.createElement(tag);if(className)el.className=className;el.textContent=text;return el}
async function loadCommentsMap(ids){const map=new Map();if(!ids.length)return map;const {data,error}=await sb.from('prayer_comments').select('id,prayer_id,commenter,body,created_at,updated_at').eq('source',COMMENT_SOURCE).in('prayer_id',ids).order('created_at',{ascending:true});if(error){console.error(error);return map}(data||[]).forEach(c=>{if(!map.has(c.prayer_id))map.set(c.prayer_id,[]);map.get(c.prayer_id).push(c)});return map}
function formatCommentDate(v){try{return new Date(v).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}catch(e){return ''}}
async function addComment(prayerId,nameInput,bodyInput,button){const commenter=nameInput.value.trim(),body=bodyInput.value.trim();if(!commenter){alert('댓글 이름을 입력해주세요.');nameInput.focus();return}if(!body){alert('댓글 내용을 입력해주세요.');bodyInput.focus();return}button.disabled=true;const {data,error}=await sb.rpc('save_prayer_comment',{p_source:COMMENT_SOURCE,p_prayer_id:prayerId,p_editor_key:commentKey,p_commenter:commenter,p_body:body});button.disabled=false;if(error){console.error(error);alert(error.message||'댓글 저장 중 오류가 발생했습니다.');return}localStorage.setItem(COMMENT_NAME_STORAGE,commenter);if(data){ownCommentIds.add(data);saveOwnComments()}bodyInput.value='';await loadSharedData()}
async function editComment(c){const nextName=prompt('댓글 이름을 수정해주세요.',c.commenter);if(nextName===null)return;const nextBody=prompt('댓글 내용을 수정해주세요.',c.body);if(nextBody===null)return;if(!nextName.trim()||!nextBody.trim()){alert('이름과 댓글 내용을 모두 입력해주세요.');return}const {data,error}=await sb.rpc('update_prayer_comment',{p_id:c.id,p_editor_key:commentKey,p_commenter:nextName.trim(),p_body:nextBody.trim()});if(error){console.error(error);alert(error.message||'댓글 수정 중 오류가 발생했습니다.');return}if(!data){alert('이 기기에서 작성한 댓글만 수정할 수 있습니다.');return}localStorage.setItem(COMMENT_NAME_STORAGE,nextName.trim());await loadSharedData()}
async function deleteComment(c){if(!confirm('이 댓글을 삭제할까요?'))return;const {data,error}=await sb.rpc('delete_prayer_comment',{p_id:c.id,p_editor_key:commentKey});if(error){console.error(error);alert(error.message||'댓글 삭제 중 오류가 발생했습니다.');return}if(!data){alert('이 기기에서 작성한 댓글만 삭제할 수 있습니다.');return}ownCommentIds.delete(c.id);saveOwnComments();await loadSharedData()}
function appendComments(card,row,comments){const box=document.createElement('div');box.className='comment-box';const head=document.createElement('div');head.className='comment-head';const count=makeText('div',`💬 댓글 ${comments.length}개`,'comment-count');const write=document.createElement('button');write.type='button';write.className='comment-write';write.textContent='댓글 달기';head.append(count,write);box.append(head);const list=document.createElement('div');list.className='comment-list';if(!comments.length){list.append(makeText('div','아직 댓글이 없습니다. 함께 기도하는 마음을 남겨보세요.','comment-empty'))}comments.forEach(c=>{const rowDiv=document.createElement('div');rowDiv.className='comment-row';const meta=document.createElement('div');meta.className='comment-meta';const who=makeText('strong',`${c.commenter} · ${formatCommentDate(c.updated_at||c.created_at)}`);meta.append(who);if(ownCommentIds.has(c.id)){const actions=document.createElement('div');actions.className='comment-actions';const edit=document.createElement('button');edit.className='comment-edit';edit.textContent='수정';edit.onclick=()=>editComment(c);const del=document.createElement('button');del.className='comment-delete';del.textContent='삭제';del.onclick=()=>deleteComment(c);actions.append(edit,del);meta.append(actions)}rowDiv.append(meta,makeText('div',c.body,'comment-body'));list.append(rowDiv)});box.append(list);const compose=document.createElement('div');compose.className='comment-compose hidden';const name=document.createElement('input');name.maxLength=40;name.placeholder='댓글 이름';name.value=localStorage.getItem(COMMENT_NAME_STORAGE)||$('person').value.trim()||'';const body=document.createElement('textarea');body.maxLength=1000;body.placeholder='함께 기도하는 마음을 남겨주세요.';const save=document.createElement('button');save.type='button';save.className='btn primary';save.textContent='댓글 등록';save.onclick=()=>addComment(row.id,name,body,save);compose.append(name,body,save);box.append(compose);write.onclick=()=>{compose.classList.toggle('hidden');if(!compose.classList.contains('hidden'))body.focus()};card.append(box)}
async function loadSharedData(){const host=$('shared-entries');host.innerHTML='<p class="notice">기도제목을 불러오는 중입니다...</p>';const {data,error}=await sb.from('shared_prayers').select('id,church,person,year,month,items,updated_at').eq('year',Number(yearSel.value)).eq('month',Number(monthSel.value)).order('updated_at',{ascending:false});if(error){console.error(error);host.innerHTML='<p class="notice err">공유 목록을 불러오지 못했습니다. 잠시 후 다시 시도해주세요.</p>';return}host.innerHTML='';if(!data||!data.length){host.innerHTML='<div class="empty">아직 작성된 기도제목이 없습니다.<br>첫 번째 기도제목을 나눠보세요. 🙏</div>';return}const commentsMap=await loadCommentsMap(data.map(r=>r.id));data.forEach(row=>{const card=document.createElement('div');card.className='shared-card';card.appendChild(makeText('div',`🙏 ${row.person} 님의 기도제목`,'shared-name'));(Array.isArray(row.items)?row.items:[]).forEach((it,i)=>{if(!it||(!it.title&&!it.body))return;const itemDiv=document.createElement('div');itemDiv.className='shared-item';itemDiv.appendChild(makeText('strong',`${i+1}. ${it.title||'기도제목'}`));itemDiv.appendChild(makeText('p',it.body||''));card.appendChild(itemDiv)});appendComments(card,row,commentsMap.get(row.id)||[]);host.appendChild(card)})}
function subscribeRealtime(){if(channel)sb.removeChannel(channel);channel=sb.channel('shared-prayers-live').on('postgres_changes',{event:'*',schema:'public',table:'shared_prayers'},payload=>{const row=payload.new||payload.old||{};if(Number(row.year)===Number(yearSel.value)&&Number(row.month)===Number(monthSel.value))loadSharedData()}).on('postgres_changes',{event:'*',schema:'public',table:'prayer_comments'},()=>loadSharedData()).subscribe()}
async function changePeriod(){items=[];render();await loadMyData();await loadSharedData();subscribeRealtime()}
$('add').onclick=()=>{items.push({title:'',body:''});render()};$('save').onclick=saveToServer;['year','month'].forEach(id=>$(id).addEventListener('change',changePeriod));render();loadMyData();loadSharedData();subscribeRealtime();
</script>
</body>
</html>
