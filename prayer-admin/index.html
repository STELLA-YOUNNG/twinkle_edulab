<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>공동 기도게시판 통합관리</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><link rel="stylesheet" href="style.css"></head><body><section id="loginView" class="login-wrap"><div class="login-card"><div class="login-mark">🔐</div><div class="eyebrow">PRAYER BOARD ADMIN</div><h1>공동 기도게시판 통합관리</h1><p>로이교회와 헤세드 찬양단 게시판을 한곳에서 관리합니다.</p><label>관리자 비밀번호</label><input id="password" type="password" autocomplete="current-password" placeholder="비밀번호 입력"><button class="primary wide" id="loginBtn">관리자 로그인</button><div id="loginMsg" class="msg">관리자만 접근할 수 있습니다.</div></div></section><section id="appView" class="hidden"><header><div class="head-inner"><div><div class="eyebrow">PRAYER BOARD ADMIN</div><h1>공동 기도게시판 통합관리</h1><p>로이교회 · 신성교회 헤세드 찬양단</p></div><div class="head-actions"><button id="printBtn">🖨️ 인쇄 / PDF</button><button id="csvBtn">⬇️ CSV</button><button id="pwBtn">🔑 비밀번호 변경</button><button id="logoutBtn">로그아웃</button></div></div></header><main><div class="tabs"><button class="tab active" data-community="all">전체 현황</button><button class="tab" data-community="roy">🙏 로이교회</button><button class="tab" data-community="hesed">🎵 헤세드 찬양단</button></div><section class="filters"><div><label>연도</label><select id="year"></select></div><div><label>월</label><select id="month"><option value="">전체 월</option></select></div><div class="searchbox"><label>작성자·기도제목 검색</label><input id="search" placeholder="이름 또는 내용 검색"></div><div class="filter-actions"><button class="soft" id="refreshBtn">새로고침</button><button class="ghost" id="clearBtn">초기화</button></div></section><section class="summary"><div class="stat"><span>현재 목록</span><strong id="totalCount">0</strong></div><div class="stat"><span>로이교회</span><strong id="royCount">0</strong></div><div class="stat"><span>헤세드 찬양단</span><strong id="hesedCount">0</strong></div><div class="stat"><span>기도제목 수</span><strong id="itemCount">0</strong></div></section><div class="toolbar"><h2 id="listTitle">전체 기도제목</h2><small id="statusText"></small></div><div id="list" class="list"></div></main></section><dialog id="editDialog"><div class="modal"><div class="modal-head"><div><div class="eyebrow">ADMIN EDIT</div><h3>기도제목 수정</h3></div><button class="ghost" id="closeModal">닫기</button></div><div class="modal-grid"><div class="person-field"><label>작성자</label><input id="editPerson"></div><div><label>연도</label><input id="editYear" type="number" min="2020" max="2100"></div><div><label>월</label><input id="editMonth" type="number" min="1" max="12"></div></div><div id="editItems" class="edit-items"></div><div class="modal-actions"><button class="soft" id="addItemBtn">＋ 항목 추가</button><div><button class="ghost" id="cancelEdit">취소</button><button class="primary" id="saveEdit">수정 저장</button></div></div><div id="editMsg" class="msg"></div></div></dialog><script src="app.js"></script><script src="admin-comments.js"></script></body></html>
