<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>월별 공유 기도제목 | 신성교회 헤세드 찬양단</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--ink:#24354a;--muted:#66758a;--line:#dce5ee;--bg:#f3f7fb;--blue:#365f8b;--blue2:#eaf2fb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR","Malgun Gothic",sans-serif;line-height:1.55}header{background:linear-gradient(130deg,#203d5b,#456d8e);color:#fff;padding:30px 18px 26px;text-align:center}.eyebrow{font-size:12px;letter-spacing:.18em;opacity:.85}h1{font-size:clamp(24px,6vw,34px);margin:8px 0 6px}header p{margin:0;color:#e2edf7}main{max-width:900px;margin:22px auto;padding:0 14px 40px}.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:16px;box-shadow:0 5px 18px #1c3b5910}.controls{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px;color:var(--muted)}select,input,textarea{font:inherit;width:100%;border:1px solid #cbd7e4;border-radius:10px;padding:11px 12px;background:#fff;color:var(--ink)}textarea{resize:vertical;min-height:88px}.monthline{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:14px}.monthline h2{font-size:21px;margin:0}.small{font-size:12px;color:var(--muted)}.entries{display:grid;gap:12px}.entry,.shared-card{border:1px solid var(--line);border-radius:13px;padding:14px;background:#fbfdff}.entryhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}.btnrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.btn{border:0;border-radius:10px;padding:11px 15px;font:inherit;font-size:14px;font-weight:700;cursor:pointer}.primary{background:var(--blue);color:#fff}.soft{background:var(--blue2);color:var(--blue)}.danger{background:#fff0ef;color:#a33c36}.notice{font-size:12px;color:var(--muted);margin-top:10px}.ok{color:#2c6a4f;font-weight:700}.err{color:#a33c36;font-weight:700}.shared-card{margin-bottom:12px}.shared-name{font-weight:700;color:var(--blue);margin-bottom:8px;border-bottom:1px solid var(--line);padding-bottom:6px}.shared-item{margin-bottom:8px}.shared-item strong{display:block;font-size:14px}.shared-item p{margin:0;font-size:14px;color:var(--muted);white-space:pre-wrap}.live{display:inline-flex;align-items:center;gap:6px}.live:before{content:"";width:8px;height:8px;border-radius:50%;background:#43a36f}footer{text-align:center;color:var(--muted);font-size:12px;padding:0 12px 28px}@media(max-width:640px){.controls{grid-template-columns:1fr}.monthline{align-items:flex-start;flex-direction:column;gap:4px}}
</style>
</head>
<body>
<header><div class="eyebrow">HESED MONTHLY PRAYER JOURNAL</div><h1>월별 공유 기도제목</h1><p>신성교회 | 헤세드 찬양단</p></header>
<main>
<section class="panel"><div class="controls">
<div class="field"><label>공동체</label><select disabled><option>신성교회 헤세드 찬양단</option></select></div>
<div class="field"><label for="person">내 이름 (작성자)</label><input id="person" maxlength="40" placeholder="이름을 정확히 입력하세요"></div>
<div class="field"><label for="year">연도</label><select id="year"></select></div>
<div class="field"><label for="month">월</label><select id="month"></select></div>
</div><p class="notice" style="color:var(--blue);font-weight:700">헤세드 찬양단에서 저장한 기도제목은 찬양단원들과 실시간으로 공유됩니다.</p></section>
<section class="panel"><div class="monthline"><h2 id="periodTitle">나의 기도제목 작성</h2><span class="small">작성 후 꼭 저장해주세요</span></div><div class="entries" id="entries"></div><div class="btnrow"><button class="btn soft" id="add">＋ 기도제목 추가</button><button class="btn primary" id="save">서버에 저장 / 공유하기</button></div><p class="notice" id="status">이름을 입력하고 기도제목을 작성한 뒤 저장하기를 눌러주세요.</p></section>
<section class="panel"><div class="monthline"><h2 id="sharedTitle">모두의 기도제목</h2><span class="small live">실시간 공유</span></div><div id="shared-entries"><p class="notice">기도제목을 불러오는 중입니다...</p></div></section>
</main><footer>조용히 기록하고, 신실하게 기도합니다.</footer>
<script>
const SUPABASE_URL='https://mmcmukiygjosimutmrup.supabase.co';
const SUPABASE_KEY='sb_publishable_cZb72z-nQsxIi5OL0N-zfA_z-qP2ngy';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY),$=id=>document.getElementById(id),yearSel=$('year'),monthSel=$('month'),now=new Date();
for(let y=now.getFullYear()-2;y<=now.getFullYear()+5;y++){const o=document.createElement('option');o.value=y;o.textContent=y+'년';if(y===now.getFullYear())o.selected=true;yearSel.append(o)}
for(let m=1;m<=12;m++){const o=document.createElement('option');o.value=m;o.textContent=m+'월';if(m===now.getMonth()+1)o.selected=true;monthSel.append(o)}
function uuid(){return crypto.randomUUID?crypto.randomUUID():'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0,v=c==='x'?r:(r&3|8);return v.toString(16)})}
const KEY='hesed-prayer-editor-key-v1';let editorKey=localStorage.getItem(KEY);if(!editorKey){editorKey=uuid();localStorage.setItem(KEY,editorKey)}
let items=[],channel=null;const periodKey=()=>`${yearSel.value}-${monthSel.value}`,rowIdKey=()=>`hesed-prayer-row-${periodKey()}`;
function setStatus(t,c=''){const e=$('status');e.textContent=t;e.className='notice'+(c?' '+c:'')}
function render(){ $('periodTitle').textContent=`${yearSel.value}년 ${monthSel.value}월 나의 기도제목`; $('sharedTitle').textContent=`${yearSel.value}년 ${monthSel.value}월 모두의 기도제목`; const h=$('entries');h.innerHTML=''; if(!items.length)items=[{title:'가정과 가족',body:''},{title:'신앙과 영적 성장',body:''}]; items.forEach((it,i)=>{const d=document.createElement('div');d.className='entry';const head=document.createElement('div');head.className='entryhead';const s=document.createElement('strong');s.textContent=`기도제목 ${i+1}`;const del=document.createElement('button');del.className='btn danger';del.textContent='항목 삭제';del.type='button';del.onclick=()=>{items.splice(i,1);render()};head.append(s,del);const ti=document.createElement('input');ti.placeholder='기도제목 이름';ti.value=it.title||'';ti.oninput=()=>items[i].title=ti.value;const b=document.createElement('textarea');b.placeholder='기도할 내용을 적어보세요.';b.value=it.body||'';b.oninput=()=>items[i].body=b.value;d.append(head,ti,b);h.append(d)})}
async function loadMine(){const id=localStorage.getItem(rowIdKey());if(!id){items=[];render();return}const {data,error}=await sb.from('hesed_prayers').select('id,person,items').eq('id',id).maybeSingle();if(error){setStatus('내 기록을 불러오지 못했습니다.','err');return}if(data){$('person').value=data.person||'';items=Array.isArray(data.items)?data.items:[];render();setStatus('이 기기에서 저장했던 기도제목을 불러왔습니다.','ok')}else{localStorage.removeItem(rowIdKey());items=[];render()}}
async function save(){const person=$('person').value.trim();if(!person){alert('이름을 입력해주세요.');return}const cleaned=items.map(x=>({title:(x.title||'').trim(),body:(x.body||'').trim()})).filter(x=>x.title||x.body);if(!cleaned.length){alert('기도제목을 한 가지 이상 작성해주세요.');return}$('save').disabled=true;setStatus('저장 중...');const {data,error}=await sb.rpc('save_hesed_prayer',{p_editor_key:editorKey,p_person:person,p_year:Number(yearSel.value),p_month:Number(monthSel.value),p_items:cleaned});$('save').disabled=false;if(error){console.error(error);setStatus('저장 오류가 발생했습니다.','err');return}localStorage.setItem(rowIdKey(),data);items=cleaned;render();setStatus('저장 완료! 모두의 화면에 공유되었습니다.','ok');loadShared()}
function text(tag,t,c){const e=document.createElement(tag);if(c)e.className=c;e.textContent=t;return e}
async function loadShared(){const h=$('shared-entries');h.innerHTML='<p class="notice">기도제목을 불러오는 중입니다...</p>';const {data,error}=await sb.from('hesed_prayers').select('id,person,items,updated_at').eq('year',Number(yearSel.value)).eq('month',Number(monthSel.value)).order('updated_at',{ascending:false});if(error){h.innerHTML='<p class="notice err">공유 목록을 불러오지 못했습니다.</p>';return}h.innerHTML='';if(!data?.length){h.innerHTML='<p class="notice">아직 작성된 기도제목이 없습니다.</p>';return}data.forEach(r=>{const c=document.createElement('div');c.className='shared-card';c.append(text('div',`🙏 ${r.person} 님의 기도제목`,'shared-name'));(Array.isArray(r.items)?r.items:[]).forEach((it,i)=>{if(!it?.title&&!it?.body)return;const d=document.createElement('div');d.className='shared-item';d.append(text('strong',`${i+1}. ${it.title||'기도제목'}`),text('p',it.body||''));c.append(d)});h.append(c)})}
function subscribe(){if(channel)sb.removeChannel(channel);channel=sb.channel('hesed-prayers-live').on('postgres_changes',{event:'*',schema:'public',table:'hesed_prayers'},p=>{const r=p.new||p.old||{};if(Number(r.year)===Number(yearSel.value)&&Number(r.month)===Number(monthSel.value))loadShared()}).subscribe()}
async function changePeriod(){items=[];render();await loadMine();await loadShared();subscribe()}
$('add').onclick=()=>{items.push({title:'',body:''});render()};$('save').onclick=save;['year','month'].forEach(id=>$(id).addEventListener('change',changePeriod));render();loadMine();loadShared();subscribe();
</script>
</body></html>
