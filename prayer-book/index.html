const dailyMeditations=[{"title":"부르심은 자격이 아니라 은혜입니다","meaning":"바울은 자신이 뛰어나서 직분을 받은 것이 아니라, 예수 그리스도께서 자신을 충성되게 여기시고 직분을 맡겨 주셨다고 고백합니다. 이사야는 하나님의 부르심을 듣고 “나를 보내소서”라고 응답했습니다. 이처럼 임직의 출발점은 개인의 공로나 자격이 아니라 하나님의 은혜이며, 그 은혜에 응답하는 순종입니다.","apply":"지금까지 신앙의 길에서 나를 붙드신 손길을 조용히 떠올려 보십시오. 임직을 인정받는 자리로 여기지는 않았는지 돌아보고, 맡겨진 직분을 하나님께 드리는 응답으로 받아들여 보십시오.","questions":["나는 왜 이 직분을 받으려 하는가?","하나님께 감사해야 할 구체적인 은혜 세 가지는 무엇인가?"],"hymns":["나 같은 죄인 살리신","부름 받아 나선 이 몸"],"response":"주님, 제 자격을 내세우지 않고 은혜에 감사하며 “제가 여기 있습니다”라고 순종하게 하소서.","hymnNumbers":[305,323]},{"title":"회개는 다른 사람이 아니라 나에게서 시작됩니다","meaning":"다윗은 자신의 죄를 숨기거나 남에게 책임을 돌리지 않고 하나님께 정결한 마음과 새로워진 영을 구했습니다. 요한일서는 죄를 자백하는 이에게 주어지는 하나님의 신실한 용서를 선포합니다. 회개는 스스로를 정죄하는 시간이 아니라 은혜 앞에서 진실해지는 시간입니다.","apply":"최근의 말과 행동을 차례로 돌아보십시오. 다른 사람의 잘못을 지적하기 전에 내 교만, 무관심, 상처 주는 말, 하나님께 소홀했던 순간을 구체적으로 인정하고 돌이키십시오.","questions":["내가 합리화하거나 숨긴 잘못은 무엇인가?","사과하거나 바로잡아야 할 관계가 있는가?"],"hymns":["정결하게 하는 샘이","내 주를 가까이 하게 함은"],"response":"하나님, 제 속에 정한 마음을 창조하시고 회개에 합당한 변화가 시작되게 하소서.","hymnNumbers":[264,338]},{"title":"십자가가 모든 섬김의 중심입니다","meaning":"바울은 많은 지식과 능력 가운데서도 예수 그리스도와 그의 십자가를 가장 중요하게 여겼습니다. 갈라디아서의 고백처럼 그리스도인은 자신의 자랑이 아니라 자기를 위해 생명을 내어주신 주님의 사랑으로 살아갑니다.","apply":"내가 교회에서 한 일, 인정받은 일, 인정받지 못해 서운했던 일을 떠올려 보십시오. 십자가 앞에서는 모든 봉사가 은혜에 대한 응답임을 기억하며, 사람의 박수보다 복음의 열매를 구하십시오.","questions":["내가 섬김을 통해 드러내려 한 것은 누구였는가?","십자가의 사랑을 이번 주 누구에게 보여 줄 수 있는가?"],"hymns":["갈보리 산 위에","웬 말인가 날 위하여"],"response":"예수님, 저의 성취가 아니라 십자가의 사랑만 자랑하게 하소서.","hymnNumbers":[150,143]},{"title":"예수님의 리더십은 낮아짐과 섬김입니다","meaning":"예수님은 큰 사람이 되려면 다른 사람을 섬겨야 한다고 가르치셨으며, 몸소 제자들의 발을 씻기심으로 그 가르침을 실천하셨습니다. 주님의 권위는 사람 위에 군림하는 힘이 아니라 사랑으로 자신을 내어주는 섬김으로 드러납니다.","apply":"직분을 맡은 뒤 기대하는 대우나 권한이 있는지 살펴보십시오. 보이지 않는 일, 번거로운 일, 아무도 알아주지 않는 일을 구체적으로 한 가지 선택해 먼저 실천할 마음을 세우십시오.","questions":["나는 섬김을 받는 것과 섬기는 것 중 무엇에 더 익숙한가?","이번 주 내가 먼저 도울 수 있는 사람은 누구인가?"],"hymns":["겸손히 주를 섬길 때","주와 같이 길 가는 것"],"response":"주님, 남에게 명령하기보다 먼저 손을 내미는 종이 되게 하소서.","hymnNumbers":[212,430]},{"title":"연합은 같아지는 것이 아니라 서로 사랑하는 것입니다","meaning":"에베소서는 겸손과 온유, 오래 참음과 사랑으로 성령의 하나 되게 하신 것을 힘써 지키라고 권면합니다. 빌립보서는 다툼과 허영을 버리고 다른 사람의 형편을 돌아보라고 말합니다. 연합은 의견 차이를 없애는 일이 아니라 존중 속에서 함께 진리를 따르는 일입니다.","apply":"최근 의견이 달랐던 사람을 떠올려 보십시오. 내 말만 반복하지 않았는지, 상대의 이유를 충분히 들었는지 돌아보십시오. 진리를 포기하지 않되 말의 태도와 해결 방식에서 화평을 선택하십시오.","questions":["나는 다름을 틀림으로 판단한 적이 있는가?","먼저 찾아가 대화하거나 격려할 동역자는 누구인가?"],"hymns":["사랑하는 주님 앞에","사철에 봄바람 불어 잇고"],"response":"성령님, 저의 고집을 내려놓고 사랑과 진리로 하나 되게 하소서.","hymnNumbers":[220,559]},{"title":"그리스도 안에 거할 때 열매가 맺힙니다","meaning":"예수님은 자신을 포도나무, 제자들을 가지에 비유하시며 주님을 떠나서는 아무것도 할 수 없다고 말씀하십니다. 시편은 주의 말씀이 걸음을 밝히는 등불이라고 고백합니다. 봉사의 분주함이 하나님과의 친밀함을 대신할 수는 없습니다.","apply":"나의 하루에서 말씀과 기도가 차지하는 자리를 정직하게 살펴보십시오. 사역을 잘하려는 노력보다 주님 안에 머무는 시간이 먼저인지 돌아보고, 지속 가능한 경건의 시간을 정하십시오.","questions":["바쁘다는 이유로 미뤄 둔 영적 습관은 무엇인가?","매일 말씀과 기도를 위해 구별할 시간은 언제인가?"],"hymns":["내 기도하는 그 시간","주와 같이 길 가는 것"],"response":"주님, 분주한 일꾼이기 전에 주님 안에 거하는 제자가 되게 하소서.","hymnNumbers":[364,430]},{"title":"가정과 일상은 믿음의 진실함을 드러냅니다","meaning":"디모데전서는 가정을 책임 있게 돌보는 삶을 교회 지도자의 중요한 자질로 제시합니다. 골로새서는 말이나 일이나 무엇을 하든지 주 예수의 이름으로 행하라고 권합니다. 신앙은 예배당 안에만 머무는 모습이 아니라 가장 가까운 사람을 대하는 태도에서 드러납니다.","apply":"가족에게 했던 말과 가정에서의 표정, 직장에서의 정직함을 돌아보십시오. 교회 봉사 때문에 가족의 필요를 외면하지 않았는지 살피고, 먼저 경청하고 감사하는 행동을 선택하십시오.","questions":["가장 가까운 사람은 나의 신앙을 어떻게 느낄까?","가정이나 직장에서 바꾸어야 할 습관 하나는 무엇인가?"],"hymns":["사철에 봄바람 불어 잇고","주와 같이 길 가는 것"],"response":"주님, 교회와 가정과 일상에서 같은 믿음의 모습으로 살아가게 하소서.","hymnNumbers":[559,430]},{"title":"교회는 그리스도의 몸이며 성도는 돌봄의 대상입니다","meaning":"에베소서 4장은 하나님께서 여러 직분을 주신 목적이 성도를 온전하게 하고 그리스도의 몸인 교회를 세우는 데 있다고 말씀합니다. 사도행전 20장은 교회가 하나님께서 피로 사신 소중한 공동체임을 일깨워 줍니다. 그러므로 교회를 섬긴다는 것은 조직의 외형을 키우는 데 그치지 않고, 한 영혼 한 영혼을 사랑으로 돌보는 일입니다.","apply":"우리 교회에서 기쁨으로 봉사하는 이들뿐 아니라 아픈 성도, 소외된 성도, 낙심한 이들을 떠올려 보십시오. 목회자와 직분자를 위해 기도하며 내가 함께 감당할 실제적인 돌봄을 생각하십시오.","questions":["내가 관심을 놓친 성도나 사역자는 누구인가?","교회의 건강을 위해 내가 먼저 실천할 작은 변화는 무엇인가?"],"hymns":["시온성과 같은 교회","교회의 참된 터는"],"response":"주님, 우리 교회가 복음과 사랑으로 한 영혼 한 영혼을 세우게 하소서.","hymnNumbers":[210,600]},{"title":"충성은 작은 책임을 오래 감당하는 것입니다","meaning":"고린도전서는 맡은 자에게 구할 것은 충성이라고 말합니다. 베드로전서는 받은 은사를 하나님의 은혜를 맡은 청지기처럼 서로를 위해 사용하라고 권합니다. 충성은 눈에 띄는 큰일보다 맡겨진 작은 일을 정직하고 지속적으로 감당하는 태도에서 자랍니다.","apply":"내가 맡은 자리에서 미루거나 소홀히 한 일이 있는지 돌아보십시오. 자신의 건강과 가정도 돌보면서 동역자와 책임을 나누고, 오래 지속할 수 있는 신실한 섬김을 계획하십시오.","questions":["오늘 내가 성실하게 감당해야 할 작은 책임은 무엇인가?","칭찬이 없어도 계속할 수 있는 섬김은 무엇인가?"],"hymns":["부름 받아 나선 이 몸","나의 생명 드리니"],"response":"주님, 주목받지 않는 자리에서도 끝까지 신실한 청지기가 되게 하소서.","hymnNumbers":[323,213]},{"title":"임직식의 하루보다 평생의 순종을 선택합니다","meaning":"로마서는 우리의 몸을 하나님께 드리는 살아 있는 제사로 설명하고, 세상의 방식보다 마음의 새로움과 하나님의 뜻을 분별하라고 권합니다. 고린도전서는 주 안에서의 수고가 헛되지 않으니 흔들리지 말고 주의 일에 힘쓰라고 격려합니다.","apply":"지난 아홉 날 동안 하나님께서 깨닫게 하신 것을 한 가지씩 되짚어 보십시오. 임직 후 어떤 모습으로 기억되고 싶은지보다 하나님 앞에서 어떤 사람으로 남고 싶은지를 생각하며 지속할 약속을 적으십시오.","questions":["앞으로도 지키고 싶은 신앙의 결단 세 가지는 무엇인가?","동역자와 교회를 위해 구체적으로 무엇을 실천할 것인가?"],"hymns":["나의 생명 드리니","내 주 되신 주를 참 사랑하고"],"response":"주님, 임직의 감격이 잠깐의 감정에 그치지 않고 평생의 순종이 되게 하소서.","hymnNumbers":[213,315]}];

let inList=false, slot=false;for(let i=0;i<body.length;i++){let s=body[i],n=body[i+1]||'';if(s.startsWith('오늘의 기도')){let prayerText=s.replace(/^오늘의 기도\s*/, '').trim();if(!prayerText&&n){prayerText=n;i++}html+='<p class="prayer-intro"><span class="prayer-label">오늘의 기도</span>'+escapeHtml(prayerText)+'</p>';continue}if(s.startsWith('오늘의 말씀')){continue}if(s==='오늘의 말씀'){html+='<div class="verse"><b>오늘의 말씀</b>'+escapeHtml(n)+'</div>';i++;continue}if(s==='오늘의 묵상과 결단'){if(inList){html+='</ul></div>';inList=false}html+='<div class="reflection"><b>✎ 오늘의 묵상과 결단</b><p>'+escapeHtml(n)+'</p><textarea aria-label="오늘의 묵상과 결단 메모" placeholder="내 마음에 남은 말씀과 결단을 적어 보세요" id="note"></textarea><small style="color:#8c806b">이 기기의 브라우저에만 저장됩니다.</small></div>';i++;continue}let time=s.match(/^(\d\d[-–]\d\d분)(?:\s+(.+))?$/);if(time){if(inList){html+='</ul></div>';inList=false}let nextTitle=time[2]||n;if(!time[2])i++;if(first&&time[1].startsWith('00-10')){if(body[i+1]&&body[i+1].startsWith('오늘의 성경 본문'))i++;let m=dailyMeditations[day-1];html+='<section class="slot"><div class="slot-head"><span class="slot-time">00–10분</span><span class="slot-title">말씀 묵상과 찬양</span></div><div class="meditation-detail"><h3>'+escapeHtml(m.title)+'</h3><b class="med-label">말씀 깊이 묵상하기</b><p>'+escapeHtml(m.meaning)+'</p><b class="med-label">나의 삶에 적용하기</b><p>'+escapeHtml(m.apply)+'</p><b class="med-label">마음에 던지는 질문</b><ol>'+m.questions.map((q,i)=>'<li><div class="question-text">'+escapeHtml(q)+'</div><textarea class="question-answer" data-answer-key="prayer_answer_day_'+day+'_question_'+(i+1)+'" aria-label="'+escapeHtml(String(day)+'일차 묵상 질문 '+(i+1)+' 답변')+'" placeholder="이 질문에 대한 나의 생각과 기도를 적어 보세요. (자동 저장)" rows="3"></textarea></li>').join('')+'</ol><div class="hymns"><b class="med-label" style="margin-top:0">관련 찬송 · 찬양</b><p>추천 찬송: <b>새찬송가 '+m.hymnNumbers[0]+'장 · '+escapeHtml(m.hymns[0])+'</b><br>선택 찬송: 새찬송가 '+m.hymnNumbers[1]+'장 · '+escapeHtml(m.hymns[1])+'</p><div class="original-lyrics"><b>함께 고백하는 노래</b><p>'+escapeHtml(originalSongLyrics[day-1]).replaceAll(' / ','<br>')+'</p><small>이 책자를 위해 새롭게 쓴 묵상 고백 가사입니다. 위에 추천한 찬송가의 공식 가사가 아닌, 이 책자를 위해 만든 고백문입니다.</small></div><small>말씀 읽기 3분 → 묵상 3분 → 찬송·고백 3분 → 응답기도 1분 (선택 찬송은 시간에 따라 활용)</small></div><b class="med-label">응답기도</b><p class="prayer-response">'+escapeHtml(m.response)+'</p></div></section>';continue}html+='<div class="slot"><div class="slot-head"><span class="slot-time">'+escapeHtml(time[1])+'</span><span class="slot-title">'+escapeHtml(nextTitle)+'</span></div><ul>';inList=true;continue}if(inList){while(i+1<body.length&&!/[.!?。！？]$/.test(s.trim())&&!/^\d\d[-–]\d\d분/.test(body[i+1])&&!body[i+1].startsWith('오늘의 묵상'))s+=' '+body[++i];html+='<li>'+escapeHtml(s)+'</li>'}else{while(i+1<body.length&&!/[.!?。！？]$/.test(s.trim())&&!/^\d\d[-–]\d\d분/.test(body[i+1])&&!body[i+1].startsWith('오늘의 묵상'))s+=' '+body[++i];html+='<p class="prose">'+escapeHtml(s)+'</p>'}}if(inList)html+='</ul></div>'}

function go(n){if(n<0||n>=pages.length)return;let direction=n>index?'anim-next':'anim-prev';index=n;$('book').classList.remove('anim-next','anim-prev');void $('book').offsetWidth;$('book').classList.add(direction);render();window.scrollTo({top:0,behavior:'smooth'})}
function renderTOC(){$('toc').innerHTML=chapters.map(([name,p])=>'<button class="toc-item '+(index===p?'active':'')+'" data-p="'+p+'"><span>'+String(p+1).padStart(2,'0')+'</span>'+escapeHtml(name)+(bookmarks.includes(p)?' ★':'')+'</button>').join('')+'<p style="margin-top:24px">★ 표시한 쪽은 책갈피로 저장됩니다.</p>';$('toc').querySelectorAll('[data-p]').forEach(x=>x.onclick=()=>{go(+x.dataset.p);toggleDrawer(false)})}
function toggleDrawer(open){$('drawer').classList.toggle('open',open);$('backdrop').classList.toggle('open',open)}$('tocBtn').onclick=()=>toggleDrawer(true);$('closeDrawer').onclick=()=>toggleDrawer(false);$('backdrop').onclick=()=>toggleDrawer(false);$('prev').onclick=()=>go(index-1);$('next').onclick=()=>go(index+1);$('larger').onclick=()=>{scale=Math.min(1.5,Math.round((scale+.1)*10)/10);localStorage.setItem('stella_prayer_size',scale);render()};$('smaller').onclick=()=>{scale=Math.max(.8,Math.round((scale-.1)*10)/10);localStorage.setItem('stella_prayer_size',scale);render()};$('themeBtn').onclick=()=>{dark=!dark;localStorage.setItem('stella_prayer_dark',dark?'1':'0');render()};$('bookmarkBtn').onclick=()=>{bookmarks=bookmarks.includes(index)?bookmarks.filter(x=>x!==index):[...bookmarks,index];localStorage.setItem('stella_prayer_bookmarks',JSON.stringify(bookmarks));render()};document.addEventListener('keydown',e=>{if(e.target.matches('textarea,input'))return;if(e.key==='ArrowRight')go(index+1);if(e.key==='ArrowLeft')go(index-1);if(e.key==='Escape')toggleDrawer(false)});let sx=0,sy=0;$('book').addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});$('book').addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>75&&Math.abs(dx)>Math.abs(dy)*1.5)go(index+(dx<0?1:-1))},{passive:true});render();
